<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #111827; color: #f9fafb; }
    main { max-width: 720px; margin: 40px auto; padding: 24px; background: #1f2937; border-radius: 18px; }
    form { display: grid; grid-template-columns: 1fr 140px auto; gap: 10px; }
    input, button { padding: 12px; border-radius: 10px; border: 0; }
    button { cursor: pointer; font-weight: 700; }
    li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #374151; }
    .total { font-size: 2rem; margin: 20px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>
    <p>Small browser app that saves expenses using localStorage.</p>
    <div class="total">Total: <span id="total">0</span> IQD</div>
    <form id="form">
      <input id="name" placeholder="Expense name" required />
      <input id="amount" type="number" min="1" placeholder="Amount" required />
      <button>Add</button>
    </form>
    <ul id="list"></ul>
  </main>
  <script>
    const form = document.querySelector('#form');
    const nameInput = document.querySelector('#name');
    const amountInput = document.querySelector('#amount');
    const list = document.querySelector('#list');
    const total = document.querySelector('#total');
    let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');

    function save() {
      localStorage.setItem('expenses', JSON.stringify(expenses));
    }

    function render() {
      list.innerHTML = '';
      let sum = 0;
      expenses.forEach((expense, index) => {
        sum += expense.amount;
        const item = document.createElement('li');
        item.innerHTML = `<span>${expense.name}</span><strong>${expense.amount.toLocaleString()} IQD</strong>`;
        item.addEventListener('dblclick', () => {
          expenses.splice(index, 1);
          save();
          render();
        });
        list.appendChild(item);
      });
      total.textContent = sum.toLocaleString();
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      expenses.push({ name: nameInput.value.trim(), amount: Number(amountInput.value) });
      form.reset();
      save();
      render();
    });

    render();
  </script>
</body>
</html>
